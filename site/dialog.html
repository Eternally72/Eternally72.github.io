<dialog class="project-dialog" id="project-dialog" aria-labelledby="project-dialog-title" aria-describedby="project-dialog-subtitle">
    <header class="details-top">
      <div><h2 id="project-dialog-title">项目详情</h2><p id="project-dialog-subtitle">架构、时序与验证记录</p></div>
      <a class="detail-source" data-project-source href="https://github.com/Eternally72" target="_blank" rel="noopener noreferrer">项目源码 <span aria-hidden="true">↗</span></a>
      <button class="detail-close" type="button" aria-label="关闭项目详情" autofocus><span aria-hidden="true">×</span></button>
    </header>
    <div class="detail-tabs" role="tablist" aria-label="项目详情内容" hidden>
      <button type="button" role="tab" id="detail-tab-architecture" aria-controls="project-panel" aria-selected="true" data-view="architecture">架构设计</button>
      <button type="button" role="tab" id="detail-tab-sequence" aria-controls="project-panel" aria-selected="false" tabindex="-1" data-view="sequence">执行时序</button>
      <button type="button" role="tab" id="detail-tab-results" aria-controls="project-panel" aria-selected="false" tabindex="-1" data-view="results">验证结果</button>
    </div>
    <div class="project-panel" id="project-panel" role="tabpanel" aria-labelledby="detail-tab-architecture" tabindex="0"></div>
  </dialog>
